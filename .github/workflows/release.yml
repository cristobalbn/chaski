name: release

# Publica en GitHub Releases y en npm cada vez que se pushea un tag vX.Y.Z.
#
# Garantiza que GitHub y npm no se desfasen:
#   1. Verifica que el tag vX.Y.Z coincida con "version" en package.json.
#   2. Verifica que CHANGELOG.md tenga la sección ## [X.Y.Z].
#   3. Ejecuta las mismas validaciones que test.yml (cero dependencias, check, tests).
#   4. Crea el GitHub Release con las notas de esa versión.
#   5. Publica en npm con provenance si NPM_TOKEN (o Trusted Publisher) está configurado.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Verificar cero dependencias
        shell: bash
        run: |
          deps=$(node -e "const p=require('./package.json');console.log(Object.keys({...p.dependencies,...p.devDependencies}).length)")
          if [ "$deps" != "0" ]; then
            echo "El proyecto declara $deps dependencia(s). Es un invariante: cero."
            exit 1
          fi

      - name: Verificar coherencia entre tag, package.json y CHANGELOG.md
        shell: bash
        run: |
          pkg_ver=$(node -e "console.log(require('./package.json').version)")
          ref_name="${GITHUB_REF_NAME:-v$pkg_ver}"
          expected_tag="v$pkg_ver"
          if [ "$ref_name" != "$expected_tag" ]; then
            echo "::error::El tag ($ref_name) no coincide con package.json ($expected_tag)."
            exit 1
          fi
          if ! grep -qE "^## \\[$pkg_ver\\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md no contiene una sección ## [$pkg_ver]."
            exit 1
          fi

      - name: Sintaxis y tests
        run: |
          npm run check
          npm test

      - name: Verificar contenido del paquete npm (dry-run)
        run: npm pack --dry-run

      - name: Crear GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          pkg_ver=$(node -e "console.log(require('./package.json').version)")
          node -e '
            const fs = require("node:fs");
            const ver = process.argv[1];
            const txt = fs.readFileSync("CHANGELOG.md", "utf8");
            const esc = ver.replace(/\./g, "\\.");
            const re = new RegExp(`^## \\[${esc}\\][^\\n]*\\n([\\s\\S]*?)(?=^## \\[|\\z)`, "m");
            const m = txt.match(re);
            fs.writeFileSync("/tmp/release-notes.md", (m ? m[1].trim() : `Release v${ver}`) + "\n");
          ' "$pkg_ver"
          gh release view "v$pkg_ver" >/dev/null 2>&1 || \
            gh release create "v$pkg_ver" --title "v$pkg_ver" --notes-file /tmp/release-notes.md

      - name: Publicar en npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning title=NPM_TOKEN no configurado::Se creó el GitHub Release, pero falta el secret NPM_TOKEN (o Trusted Publisher en npmjs.com) para publicar automáticamente en npm. Ejecuta 'npm publish' localmente o configura NPM_TOKEN en Settings → Secrets and variables → Actions."
            {
              echo "### Publicación en npm pendiente"
              echo "El GitHub Release se creó correctamente, pero el secret \`NPM_TOKEN\` no está configurado en el repositorio."
              echo "1. Genera un Granular Access Token en [npmjs.com](https://www.npmjs.com/) (o configura **Trusted Publishing** para \`cristobalbn/chaski\` y \`release.yml\`)."
              echo "2. Guárdalo como secret \`NPM_TOKEN\` en GitHub (\`Settings → Secrets and variables → Actions\`), o ejecuta \`npm publish\` desde tu máquina."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npm publish --provenance --access public
