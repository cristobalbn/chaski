name: release

# Publica en GitHub Releases y en npm cuando:
#   - Se mergea a main un cambio en package.json con una versión nueva.
#   - Se pushea directamente un tag vX.Y.Z.
#   - Se dispara manualmente desde GitHub Actions (workflow_dispatch).
#
# Garantiza que GitHub y npm no se desfasen:
#   1. Verifica que CHANGELOG.md tenga la sección ## [X.Y.Z] de package.json.
#   2. Ejecuta las mismas validaciones que test.yml (cero dependencias, check, tests).
#   3. Si el tag vX.Y.Z aún no existe, lo crea y lo empuja a origin.
#   4. Crea el GitHub Release con las notas de esa versión (si no existe).
#   5. Si chaski@X.Y.Z aún no está en npm, lo publica con provenance.

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Verificar cero dependencias
        shell: bash
        run: |
          deps=$(node -e "const p=require('./package.json');console.log(Object.keys({...p.dependencies,...p.devDependencies}).length)")
          if [ "$deps" != "0" ]; then
            echo "El proyecto declara $deps dependencia(s). Es un invariante: cero."
            exit 1
          fi

      - name: Verificar coherencia entre tag, package.json y CHANGELOG.md
        shell: bash
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::El commit actual no pertenece a la rama protegida main. Todo release debe fusionarse primero en main mediante Pull Request."
            exit 1
          fi
          pkg_ver=$(node -e "console.log(require('./package.json').version)")
          expected_tag="v$pkg_ver"
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]] && [ "${GITHUB_REF_NAME}" != "$expected_tag" ]; then
            echo "::error::El tag (${GITHUB_REF_NAME}) no coincide con package.json ($expected_tag)."
            exit 1
          fi
          if ! grep -qE "^## \\[$pkg_ver\\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md no contiene una sección ## [$pkg_ver]."
            exit 1
          fi

      - name: Sintaxis y tests
        run: |
          npm run check
          npm test

      - name: Verificar contenido del paquete npm (dry-run)
        run: npm pack --dry-run

      - name: Asegurar tag y GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          pkg_ver=$(node -e "console.log(require('./package.json').version)")
          tag="v$pkg_ver"
          if ! git rev-parse "$tag" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$tag"
            git push origin "$tag"
          fi
          node -e '
            const fs = require("node:fs");
            const ver = process.argv[1];
            const txt = fs.readFileSync("CHANGELOG.md", "utf8");
            const esc = ver.replace(/\./g, "\\.");
            const re = new RegExp(`^## \\[${esc}\\][^\\n]*\\n([\\s\\S]*?)(?=^## \\[|\\z)`, "m");
            const m = txt.match(re);
            fs.writeFileSync("/tmp/release-notes.md", (m ? m[1].trim() : `Release v${ver}`) + "\n");
          ' "$pkg_ver"
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "$tag" --notes-file /tmp/release-notes.md

      - name: Publicar en npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          pkg_ver=$(node -e "console.log(require('./package.json').version)")
          published_ver=$(npm view "@cristobalbn/chaski@$pkg_ver" version 2>/dev/null || echo "")
          if [ "$published_ver" = "$pkg_ver" ]; then
            echo "@cristobalbn/chaski@$pkg_ver ya está publicado en npm."
            exit 0
          fi
          # Si no hay NPM_TOKEN, intentamos publicar mediante OIDC Trusted Publishing
          # (requiere npm >= 11.5.1 y id-token: write).
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            npm install -g npm@latest
            rm -f ~/.npmrc "$NPM_CONFIG_USERCONFIG"
          fi
          # --loglevel verbose: sin él, un rechazo del intercambio OIDC (trusted
          # publisher que no coincide, acción "publish" no permitida) solo se ve
          # como ENEEDAUTH, sin el motivo. Pasó con v0.1.1.
          if ! npm publish --provenance --access public --loglevel verbose; then
            # Falla en rojo, no con un warning. Con v0.1.1 el paso salió verde
            # tres veces seguidas sin haber publicado nada: quien mira la lista
            # de runs cree que npm ya tiene la versión. El tag y el Release ya
            # quedaron creados, y re-correr el workflow es idempotente (se salta
            # lo que ya existe), así que fallar no deja nada a medias.
            echo "::error title=Publicación en npm fallida (v$pkg_ver)::Se creó el tag y el GitHub Release v$pkg_ver, pero @cristobalbn/chaski@$pkg_ver no se publicó en npm. Revisa el log verbose de arriba (un 'OIDC token exchange error' apunta al Trusted Publisher de npmjs.com) y vuelve a correr el workflow."
            exit 1
          fi
