name: test

# Dos cosas que este workflow resuelve:
#   - Que un PR con tests rotos no pueda entrar a main.
#   - Que el proyecto se verifique en macOS y Linux, donde nunca se probó.
#     El envoltorio de hooks genera un .sh para Unix que hasta ahora nadie
#     había ejecutado.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20', '22', 'lts/*']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # No hay npm install: el proyecto no tiene dependencias, y eso es un
      # invariante. Si alguien agrega una, este paso lo delata.
      - name: Verificar que no haya dependencias
        shell: bash
        run: |
          deps=$(node -e "const p=require('./package.json');console.log(Object.keys({...p.dependencies,...p.devDependencies}).length)")
          if [ "$deps" != "0" ]; then
            echo "El proyecto declara $deps dependencia(s). Es un invariante: cero."
            exit 1
          fi

      - name: Sintaxis
        run: npm run check

      - name: Tests
        run: npm test

      # git es dependencia de runtime: los hechos salen de ahí.
      - name: Comprobar que git está disponible
        run: git --version

      # Cuando entra un PR a main, recuerda en el resumen de GitHub Actions si
      # la versión en npm o el último tag quedaron atrás respecto a main.
      - name: Estado de sincronización con npm y tags
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.os == 'ubuntu-latest' && matrix.node == '22'
        shell: bash
        run: |
          pkg_ver=$(node -e "console.log(require('./package.json').version)")
          npm_ver=$(npm view chaski version 2>/dev/null || echo "no-publicado")
          last_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "sin-tags")
          {
            echo "### Sincronización GitHub ↔ npm"
            echo ""
            echo "| Fuente | Versión |"
            echo "|---|---|"
            echo "| \`package.json\` en \`main\` | \`$pkg_ver\` |"
            echo "| Último tag en GitHub | \`$last_tag\` |"
            echo "| Registro público de npm (\`chaski\`) | \`$npm_ver\` |"
            echo ""
            if [ "$npm_ver" != "$pkg_ver" ] || [ "$last_tag" != "v$pkg_ver" ]; then
              echo "> **Recordatorio:** \`main\` avanzó o aún no está publicada la versión \`$pkg_ver\` en npm/tags."
              echo "> Para publicar en GitHub Releases y npm:"
              echo "> \`\`\`bash"
              echo "> npm version patch   # o minor / major, tras actualizar CHANGELOG.md"
              echo "> git push origin main --follow-tags"
              echo "> \`\`\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$npm_ver" != "$pkg_ver" ]; then
            echo "::notice title=Sincronizar npm::main tiene package.json v$pkg_ver y npm tiene '$npm_ver'. Sube un tag vX.Y.Z o ejecuta npm publish para actualizar npm."
          fi
